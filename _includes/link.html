<a href="{{ include.url }}" class="link no-external-link-icon">
    <img src="{{ include.image_url }}" alt="Link image" />
    <div class="link-content">
        <div class="link-title-and-text external-link">
            <span class="link-title">{{ include.title }}</span>
            &nbsp;-&nbsp;
            <span class="link-text">{{ include.text }}</span>
        </div>
        <div class="link-url">{{ include.url }}</div>
    </div>
</a>
