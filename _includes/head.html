<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#fdfdfd" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#212121" media="(prefers-color-scheme: dark)">
    <meta name="format-detection" content="telephone=no">
    
    {%- assign title = site.description[page.lang] -%}
    {%- if page.title -%}
        {%- assign title = page.title | append: " - " | append: site.description[page.lang] -%}
    {%- endif -%}
    <title>{{ title }}</title>
    <meta name="description" content="{{ site.description[page.lang] }}" />
    <meta name="author" content="{{ site.author }}" />

    <meta property="og:title" content="{{ title }}" />
    <meta property="og:site_name" content="{{ site.description[page.lang] }}" />
    <meta property="og:description" content="{{ site.description[page.lang] }}" />
    <meta property="og:locale" content="{{ page.lang }}" />
    <meta property="og:type" content="website" />
    
    <meta name="twitter:card" content="summary" />
    <meta property="twitter:title" content="{{ site.description[page.lang] }}" />

    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/custom.css' | relative_url }}?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
    {%- feed_meta -%}
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
</head>
