<div class="inline-image-item">
    <p>
        <a href="{{ include.url }}" title="Click to view full size image">
            <img src="{{ include.url }}" alt="{{ include.alt }}"
            width="{{ include.width }}" height="{{ include.height }}"
            style="width:{{ include.width }}" />
        </a>
    </p>
    <p class="image-legend">{{ include.legend }}</p>
</div>
