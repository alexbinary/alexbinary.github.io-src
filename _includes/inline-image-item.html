{% if page.lang == 'fr' %}
    {% assign title = "Cliquer pour agrandir l'image" %}
{% elsif page.lang == 'en' %}
    {% assign title = "Click to view full size image" %}
{% endif %}

<figure class="inline-image-item" id="{{ include.id }}">
    <p class="image-p">
        <a href="{{ include.url }}" title="{{ title }}">
            <img src="{{ include.url }}{% if jekyll.environment == "development" %}?v={{ site.time | date: '%Y%m%d%H%M%S' }}{% endif %}" alt="{{ include.alt | escape }}"
            width="{{ include.width }}" height="{{ include.height }}"
            style="width:{{ include.width }}" />
        </a>
    </p>
    <figcaption class="image-legend">{{ include.legend }}</figcaption>
</figure>
