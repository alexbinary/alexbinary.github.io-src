---
layout: default
---
<article class="post">

  <header class="post-header">
    <h1 class="post-title">{{ page.title | escape }}</h1>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  {% if page.lang == 'en' %}
    Last updated {{ page.last_updated | date: "%b %-d, %Y" }}
  {% else %}
    Dernière mise à jour le {{ page.last_updated | date: "%-d %b %Y" }}
  {% endif %}

</article>
